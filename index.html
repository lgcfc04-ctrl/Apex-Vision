<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Apex Vision OS | Pro</title>

    <style>
        :root {
            /* Tema Inicial (Laranja) */
            --bg: #000000;
            --surface: #1c1c1e;
            --accent: #ff6b00;
            --text: #ffffff;
            --text-dim: #8e8e93;
            --btn-active: #3a3a3c;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Classes de Temas Profissionais */
        .theme-roxo { --accent: #9d4edd; }
        .theme-verde { --accent: #2dce89; }
        .theme-azul { --accent: #007aff; }
        .theme-rosa { --accent: #ff2d55; }
        .theme-vermelho { --accent: #ff3b30; }
        .theme-cinza { --accent: #ebebf5; }
        .theme-allblack { --surface: #111111; --accent: #ffffff; }
        .theme-white { 
            --bg: #f2f2f7; --surface: #ffffff; --text: #000000; 
            --text-dim: #636366; --accent: #007aff; --btn-active: #e5e5ea;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        /* Seletor de Temas (Scroll Horizontal) */
        .theme-selector {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 15px 0;
            scrollbar-width: none;
        }
        .theme-selector::-webkit-scrollbar { display: none; }

        .theme-dot {
            min-width: 25px; height: 25px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            cursor: pointer;
        }

        /* Display */
        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            padding: 20px 0;
        }

        #hist { color: var(--text-dim); font-size: 1.2rem; min-height: 1.5rem; margin-bottom: 8px; }
        #res { font-size: 4.8rem; font-weight: 200; line-height: 1; transition: var(--transition); }

        /* Quick Actions Bar */
        .actions {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px;
        }
        .btn-a {
            background: var(--surface); border: none; color: var(--text-dim);
            padding: 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 700;
        }

        /* Keypad */
        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 14px; padding-bottom: 30px;
        }

        button.k {
            border: none; background: var(--surface); color: var(--text);
            aspect-ratio: 1; border-radius: 50%; font-size: 1.8rem;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }

        button.k:active { 
            transform: scale(0.9);
            background: var(--btn-active);
        }

        .k.spec { background: #a5a5a5; color: #000; }
        .k.op { color: var(--accent); font-size: 2.2rem; }
        .k.equal { background: var(--accent); color: #fff; }
        .k.zero { grid-column: span 2; aspect-ratio: auto; border-radius: 50px; padding-left: 30px; justify-content: flex-start; }

        /* Estilo para Branco */
        .theme-white .k.spec { background: #d1d1d6; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="theme-selector">
        <div class="theme-dot" style="background:#ff6b00" onclick="setTheme('')"></div>
        <div class="theme-dot" style="background:#9d4edd" onclick="setTheme('theme-roxo')"></div>
        <div class="theme-dot" style="background:#2dce89" onclick="setTheme('theme-verde')"></div>
        <div class="theme-dot" style="background:#007aff" onclick="setTheme('theme-azul')"></div>
        <div class="theme-dot" style="background:#ff2d55" onclick="setTheme('theme-rosa')"></div>
        <div class="theme-dot" style="background:#ff3b30" onclick="setTheme('theme-vermelho')"></div>
        <div class="theme-dot" style="background:#ebebf5" onclick="setTheme('theme-cinza')"></div>
        <div class="theme-dot" style="background:#111" onclick="setTheme('theme-allblack')"></div>
        <div class="theme-dot" style="background:#fff" onclick="setTheme('theme-white')"></div>
    </div>

    <div class="display">
        <div id="hist"></div>
        <div id="res">0</div>
    </div>

    <div class="actions">
        <button class="btn-a" onclick="engine.log()">LOG10</button>
        <button class="btn-a" onclick="engine.bhaskara()">EQUATION</button>
        <button class="btn-a" onclick="engine.del()">DELETE</button>
    </div>

    <div class="grid">
        <button class="k spec" onclick="engine.clr()">AC</button>
        <button class="k spec" onclick="engine.sign()">+/-</button>
        <button class="k spec" onclick="engine.perc()">%</button>
        <button class="k op" onclick="engine.add('/')">÷</button>

        <button class="k" onclick="engine.add('7')">7</button>
        <button class="k" onclick="engine.add('8')">8</button>
        <button class="k" onclick="engine.add('9')">9</button>
        <button class="k op" onclick="engine.add('*')">×</button>

        <button class="k" onclick="engine.add('4')">4</button>
        <button class="k" onclick="engine.add('5')">5</button>
        <button class="k" onclick="engine.add('6')">6</button>
        <button class="k op" onclick="engine.add('-')">−</button>

        <button class="k" onclick="engine.add('1')">1</button>
        <button class="k" onclick="engine.add('2')">2</button>
        <button class="k" onclick="engine.add('3')">3</button>
        <button class="k op" onclick="engine.add('+')">+</button>

        <button class="k zero" onclick="engine.add('0')">0</button>
        <button class="k" onclick="engine.add('.')">,</button>
        <button class="k equal" onclick="engine.solve()">=</button>
    </div>
</div>

        update() {
            const r = document.getElementById('res');
            r.innerText = this.cur;

            r
