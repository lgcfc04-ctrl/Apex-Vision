<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apex Vision OS | Professional Suite</title>
    
    <style>
        :root {
            /* Palette - Industrial & Modern */
            --brand-primary: #ff6b00;
            --surface-background: #000000;
            --surface-container: #1c1c1e;
            --surface-elevated: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-invert: #000000;
            
            /* Shadows & Effects */
            --btn-transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --haptic-scale: scale(0.94);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        body {
            background-color: var(--surface-background);
            color: var(--text-primary);
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        /* Top Navigation Bar */
        .navigation-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 24px 0;
        }

        .nav-item {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--btn-transition);
            position: relative;
        }

        .nav-item.active { color: var(--brand-primary); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 0; width: 100%;
            height: 2px; background: var(--brand-primary);
            border-radius: 2px;
        }

        /* Screen States */
        .view { display: none; flex-direction: column; flex: 1; animation: slideUp 0.4s ease-out; }
        .view.active { display: flex; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Professional Display Area */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            padding: 40px 10px;
        }

        #history-output {
            color: var(--text-secondary);
            font-size: 1.25rem;
            min-height: 1.8rem;
            margin-bottom: 8px;
            font-weight: 300;
        }

        #main-output {
            font-size: 5rem;
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
        }

        /* Advanced Actions Bar */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--surface-container);
            border: none;
            border-radius: 14px;
            color: var(--text-secondary);
            height: 46px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--btn-transition);
        }

        /* Core Keyboard Grid */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding-bottom: 20px;
        }

        button.key {
            border: none;
            outline: none;
            background: var(--surface-container);
            color: var(--text-primary);
            aspect-ratio: 1/1;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            cursor: pointer;
            transition: var(--btn-transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.key:active { transform: var(--haptic-scale); filter: brightness(1.5); }

        .key.modifier { background: #a5a5a5; color: var(--text-invert); }
        .key.operator { color: var(--brand-primary); font-size: 2.2rem; }
        .key.equal { background: var(--brand-primary); color: var(--text-primary); }
        
        .key.double-span {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 50px;
            padding-left: 32px;
            justify-content: flex-start;
        }

        /* Converter View Styles */
        .converter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-top: 20px;
        }

        .module-card {
            background: var(--surface-container);
            border-radius: 20px;
            padding: 24px;
            text-align: left;
            border: 1px solid #2c2c2e;
            transition: var(--btn-transition);
        }

        .module-card:active { transform: scale(0.96); background: var(--surface-elevated); }
        .module-label { color: var(--text-secondary); font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; }
        .module-title { font-size: 1.1rem; margin-top: 4px; display: block; }

        /* Modal Solver Professional */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }

        .modal input {
            background: transparent; border: none; border-bottom: 2px solid var(--surface-elevated);
            color: var(--text-primary); font-size: 2rem; width: 80%; text-align: center;
            margin: 15px 0; padding: 10px; outline: none; transition: 0.3s;
        }

        .modal input:focus { border-bottom-color: var(--brand-primary); }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="navigation-bar">
        <div class="nav-item active" onclick="ui.switchTab('calc', this)">Calculator</div>
        <div class="nav-item" onclick="ui.switchTab('conv', this)">Modules</div>
    </nav>

    <section id="view-calc" class="view active">
        <div class="display-container">
            <div id="history-output"></div>
            <div id="main-output">0</div>
        </div>

        <div class="quick-actions">
            <button class="btn-action" onclick="engine.calcLog()">LOG10</button>
            <button class="btn-action" onclick="ui.toggleModal(true)">EQUATION</button>
            <button class="btn-action" onclick="engine.backspace()">DELETE</button>
        </div>

        <div class="keypad-grid">
            <button class="key modifier" onclick="engine.clear()">AC</button>
            <button class="key modifier" onclick="engine.toggleSign()">+/-</button>
            <button class="key modifier" onclick="engine.percentage()">%</button>
            <button class="key operator" onclick="engine.appendOperator('/')">÷</button>

            <button class="key" onclick="engine.appendNumber('7')">7</button>
            <button class="key" onclick="engine.appendNumber('8')">8</button>
            <button class="key" onclick="engine.appendNumber('9')">9</button>
            <button class="key operator" onclick="engine.appendOperator('*')">×</button>

            <button class="key" onclick="engine.appendNumber('4')">4</button>
            <button class="key" onclick="engine.appendNumber('5')">5</button>
            <button class="key" onclick="engine.appendNumber('6')">6</button>
            <button class="key operator" onclick="engine.appendOperator('-')">−</button>

            <button class="key" onclick="engine.appendNumber('1')">1</button>
            <button class="key" onclick="engine.appendNumber('2')">2</button>
            <button class="key" onclick="engine.appendNumber('3')">3</button>
            <button class="key operator" onclick="engine.appendOperator('+')">+</button>

            <button class="key double-span" onclick="engine.appendNumber('0')">0</button>
            <button class="key" onclick="engine.appendNumber('.')">.</button>
            <button class="key equal" onclick="engine.compute()">=</button>
        </div>
    </section>

    <section id="view-conv" class="view">
        <div class="converter-grid">
            <div class="module-card" onclick="ui.haptic()">
                <span class="module-label">HEALTH</span>
                <span class="module-title">Body Mass</span>
            </div>
            <div class="module-card" onclick="ui.haptic()">
                <span class="module-label">FINANCE</span>
                <span class="module-title">Currency</span>
            </div>
            <div class="module-card" onclick="ui.haptic()">
                <span class="module-label">MATH</span>
                <span class="module-title">Geometry</span>
            </div>
            <div class="module-card" onclick="ui.haptic()">
                <span class="module-label">SYSTEM</span>
                <span class="module-title">Binary</span>
            </div>
        </div>
    </section>
</div>

<div id="modal-solver" class="modal">
    <span class="module-label" style="margin-bottom: 20px;">QUADRATIC SOLVER</span>
    <input type="number" id="inpA" placeholder="Value A">
    <input type="number" id="inpB" placeholder="Value B">
    <input type="number" id="inpC" placeholder="Value C">
    <div style="display: flex; gap: 20px; margin-top: 40px;">
        <button class="btn-action" style="width: 120px; background: var(--brand-primary); color: white;" onclick="engine.solveQuadratic()">Solve</button>
        <button class="btn-action" style="width: 120px;" onclick="ui.toggleModal(false)">Close</button>
    </div>
</div>

<script>
    /**
     * UI Controller - Handles visual updates and haptics
     */
    const ui = {
        haptic: () => {
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        },
        switchTab: (tabId, el) => {
            ui.haptic();
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(`view-${tabId}`).classList.add('active');
        },
        updateDisplay: (main, history) => {
            const out = document.getElementById('main-output');
            out.innerText = main;
            document.getElementById('history-output').innerText = history;
            
            // Dynamic font sizing
            out.style.fontSize = main.length > 7 ? (main.length > 11 ? "2rem" : "3rem") : "5rem";
        },
        toggleModal: (show) => {
            ui.haptic();
            document.getElementById('modal-solver').style.display = show ? 'flex' : 'none';
        }
    };

    /**
     * Calculation Engine - Business Logic
     */
    const engine = {
        current: '0',
        history: '',
        isNewOp: false,

        appendNumber: (num) => {
            ui.haptic();
            if (engine.current === '0' || engine.isNewOp) {
                engine.current = num;
                engine.isNewOp = false;
            } else {
                engine.current += num;
            }
            ui.updateDisplay(engine.current, engine.history);
        },

        appendOperator: (op) => {
            ui.haptic();
            engine.history = `${engine.current} ${op}`;
            engine.isNewOp = true;
            ui.updateDisplay(engine.current, engine.history);
        },

        clear: () => {
            ui.haptic();
            engine.current = '0';
            engine.history = '';
            ui.updateDisplay('0', '');
        },

        compute: () => {
            ui.haptic();
            try {
                let expression = `${engine.history} ${engine.current}`;
                let result = eval(expression.replace(/×/g, '*').replace(/÷/g, '/'));
                engine.history = `${expression} =`;
                engine.current = String(Number(result.toFixed(8)));
                engine.isNewOp = true;
                ui.updateDisplay(engine.current, engine.history);
            } catch (e) {
                ui.updateDisplay('Error', '');
            }
        },

        solveQuadratic: () => {
            const a = parseFloat(document.getElementById('inpA').value);
            const b = parseFloat(document.getElementById('inpB').value);
            const c = parseFloat(document.getElementById('inpC').value);
            const delta = (b * b) - (4 * a * c);
            
            if(delta < 0) {
                engine.current = "No real roots";
            } else {
                const x1 = (-b + Math.sqrt(delta)) / (2 * a);
                const x2 = (-b - Math.sqrt(delta)) / (2 * a);
                engine.current = `x1:${x1.toFixed(2)} x2:${x2.toFixed(2)}`;
            }
            ui.toggleModal(false);
            ui.updateDisplay(engine.current, `Δ = ${delta}`);
        }
        // ... (outras funções simplificadas para brevidade)
    };
</script>
</body>
  </html>
