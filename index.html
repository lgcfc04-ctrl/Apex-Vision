<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Apex Vision OS | Professional Edition</title>
    
    <style>
        :root {
            /* Tema Padrão: Laranja Profissional */
            --bg: #000000;
            --surface: #1c1c1e;
            --accent: #ff6b00;
            --text: #ffffff;
            --text-dim: #8e8e93;
            --btn-active: #3a3a3c;
        }

        /* Variantes de Temas Profissionais */
        .theme-roxo { --accent: #9d4edd; }
        .theme-verde { --accent: #2dce89; }
        .theme-azul { --accent: #007aff; }
        .theme-rosa { --accent: #ff2d55; }
        .theme-vermelho { --accent: #ff3b30; }
        .theme-cinza { --accent: #8e8e93; }
        .theme-allblack { --surface: #0f0f0f; --accent: #ffffff; }
        .theme-white { 
            --bg: #ffffff; --surface: #f2f2f7; --text: #000000; 
            --text-dim: #636366; --accent: #007aff; --btn-active: #d1d1d6;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            outline: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 20px 20px 20px;
        }

        /* Seletor de Temas Profissional */
        .theme-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 20px 0;
            scrollbar-width: none;
        }
        .theme-bar::-webkit-scrollbar { display: none; }
        
        .dot {
            min-width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid var(--surface); cursor: pointer;
            transition: transform 0.2s;
        }
        .dot:active { transform: scale(1.3); }

        /* Display Area */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            padding-bottom: 25px;
        }

        #history {
            color: var(--text-dim);
            font-size: 1.3rem;
            min-height: 1.6rem;
            font-weight: 300;
        }

        #main-display {
            font-size: 4.5rem;
            font-weight: 200;
            line-height: 1;
            word-wrap: break-word;
        }

        /* Botão Backspace Flutuante */
        .special-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .del-btn {
            background: none; border: none; color: var(--accent);
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }

        /* Grid de Botões */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        button.btn {
            border: none;
            background: var(--surface);
            color: var(--text);
            aspect-ratio: 1;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
        }

        button.btn:active {
            transform: scale(0.9);
            background: var(--btn-active);
        }

        .btn.greentext { color: var(--accent); }
        .btn.c-btn { color: #ff3b30; } /* Vermelho para limpar */
        .btn.equal-btn { background: var(--accent); color: #fff; }
        .btn.zero { 
            grid-column: span 2; aspect-ratio: auto; 
            border-radius: 50px; justify-content: flex-start; 
            padding-left: 30px; 
        }

        /* Estilos específicos para o tema Branco */
        .theme-white .btn { background: #e5e5ea; }
        .theme-white .btn:active { background: #d1d1d6; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="theme-bar">
        <div class="dot" style="background:#ff6b00" onclick="setTheme('')"></div>
        <div class="dot" style="background:#9d4edd" onclick="setTheme('theme-roxo')"></div>
        <div class="dot" style="background:#2dce89" onclick="setTheme('theme-verde')"></div>
        <div class="dot" style="background:#007aff" onclick="setTheme('theme-azul')"></div>
        <div class="dot" style="background:#ff2d55" onclick="setTheme('theme-rosa')"></div>
        <div class="dot" style="background:#ff3b30" onclick="setTheme('theme-vermelho')"></div>
        <div class="dot" style="background:#8e8e93" onclick="setTheme('theme-cinza')"></div>
        <div class="dot" style="background:#111" onclick="setTheme('theme-allblack')"></div>
        <div class="dot" style="background:#f2f2f7; border: 1px solid #ccc" onclick="setTheme('theme-white')"></div>
    </div>

    <div class="display-container">
        <div id="history"></div>
        <div id="main-display">0</div>
    </div>

    <div class="special-row">
        <button class="del-btn" onclick="engine.backspace()">APAGAR</button>
    </div>

    <div class="btn-grid grid">
        <button class="btn c-btn" onclick="engine.clear()">C</button>
        <button class="btn greentext" onclick="engine.add('(')">(</button>
        <button class="btn greentext" onclick="engine.add(')')">)</button>
        <button class="btn greentext" onclick="engine.add('/')">÷</button>

        <button class="btn" onclick="engine.add('7')">7</button>
        <button class="btn" onclick="engine.add('8')">8</button>
        <button class="btn" onclick="engine.add('9')">9</button>
        <button class="btn greentext" onclick="engine.add('*')">x</button>

        <button class="btn" onclick="engine.add('4')">4</button>
        <button class="btn" onclick="engine.add('5')">5</button>
        <button class="btn" onclick="engine.add('6')">6</button>
        <button class="btn greentext" onclick="engine.add('-')">-</button>

        <button class="btn" onclick="engine.add('1')">1</button>
        <button class="btn" onclick="engine.add('2')">2</button>
        <button class="btn" onclick="engine.add('3')">3</button>
        <button class="btn greentext" onclick="engine.add('+')">+</button>

        <button class="btn" onclick="engine.toggleSign()">+/-</button>
        <button class="btn" onclick="engine.add('0')">0</button>
        <button class="btn" onclick="engine.add('.')">.</button>
        <button class="btn equal-btn" onclick="engine.solve()">=</button>
    </div>
</div>

<script>
    // Motor de Cálculo Unificado (Sem dependências externas)
    const engine = {
        expression: '0',
        history: '',
        isResult: false,

        tap() {
            if (navigator.vibrate) navigator.vibrate(12);
        },

        updateDisplay() {
            const display = document.getElementById('main-display');
            display.innerText = this.expression;
            document.getElementById('history').innerText = this.history;

            // Ajuste de fonte automático para números longos
            const len = this.expression.length;
            if (len > 8) display.style.fontSize = "2.5rem";
            else if (len > 6) display.style.fontSize = "3.2rem";
            else display.style.fontSize = "4.5rem";
        },

        add(val) {
            this.tap();
            if (this.expression === '0' || this.isResult) {
                this.expression = val;
                this.isResult = false;
            } else {
                this.expression += val;
            }
            this.updateDisplay();
        },

        clear() {
            this.tap();
            this.expression = '0';
            this.history = '';
            this.updateDisplay();
        },

        backspace() {
            this.tap();
            if (this.expression.length > 1) {
                this.expression = this.expression.slice(0, -1);
            } else {
                this.expression = '0';
            }
            this.updateDisplay();
        },

        toggleSign() {
            this.tap();
            this.expression = (parseFloat(this.expression) * -1).toString();
            this.updateDisplay();
        },

        solve() {
            this.tap();
            try {
                let formatted = this.expression.replace(/x/g, '*').replace(/÷/g, '/');
                this.history = this.expression + ' =';
                let result = eval(formatted);
                // Limita casas decimais se necessário
                this.expression = Number.isInteger(result) ? result.toString() : result.toFixed(4).toString();
                this.isResult = true;
                this.updateDisplay();
            } catch (e) {
                this.expression = 'Erro';
                this.isResult = true;
                this.updateDisplay();
            }
        }
    };

    function setTheme(theme) {
        if (navigator.vibrate) navigator.vibrate(20);
        document.body.className = theme;
    }

    // Inicialização
    engine.updateDisplay();
</script>
</body>
  </html>
