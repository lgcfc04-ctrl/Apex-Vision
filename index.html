<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Vision Pro</title>
    <style>
        :root { --bg: #000; --btn-num: #111; --btn-op: #222; --btn-spec: #a5a5a5; }
        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: white; overflow: hidden; }
        .app { background: var(--bg); width: 100%; max-width: 375px; height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; opacity: 0.6; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        .display { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; text-align: right; padding: 20px 0; }
        #res { font-size: 4rem; font-weight: 200; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { aspect-ratio: 1/1; border: none; border-radius: 50%; font-size: 1.5rem; color: white; cursor: pointer; }
        .n { background: var(--btn-num); } .o { background: var(--btn-op); } .s { background: var(--btn-spec); color: black; }
        .zero { grid-column: span 2; aspect-ratio: auto; border-radius: 50px; text-align: left; padding-left: 25px; }
        #solver { display: none; position: absolute; background: rgba(0,0,0,0.95); top: 0; left: 0; right: 0; bottom: 0; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        input { background: #111; border: 1px solid #333; color: white; padding: 15px; margin: 5px; width: 60%; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="app">
    <div class="header"><span>Apex Vision Pro</span></div>
    <div class="display"><div id="hist" style="color:#444"></div><div id="res">0</div></div>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:15px;">
        <button style="height:40px; border-radius:8px; background:#0a0a0a; font-size:0.7rem; color:#a5a5a5;" onclick="calcLog()">LOG</button>
        <button style="height:40px; border-radius:8px; background:#0a0a0a; font-size:0.7rem; color:#a5a5a5;" onclick="openSolver()">2º GRAU</button>
        <button style="height:40px; border-radius:8px; background:#0a0a0a; font-size:0.7rem; color:#a5a5a5;" onclick="back()">DEL</button>
    </div>
    <div class="grid">
        <button class="s" onclick="clr()">AC</button><button class="s" onclick="sign()">+/-</button><button class="s" onclick="perc()">%</button><button class="o" onclick="add('/')">÷</button>
        <button class="n" onclick="add('7')">7</button><button class="n" onclick="add('8')">8</button><button class="n" onclick="add('9')">9</button><button class="o" onclick="add('*')">×</button>
        <button class="n" onclick="add('4')">4</button><button class="n" onclick="add('5')">5</button><button class="n" onclick="add('6')">6</button><button class="o" onclick="add('-')">−</button>
        <button class="n" onclick="add('1')">1</button><button class="n" onclick="add('2')">2</button><button class="n" onclick="add('3')">3</button><button class="o" onclick="add('+')">+</button>
        <button class="n zero" onclick="add('0')">0</button><button class="n" onclick="add('.')">.</button><button class="o" onclick="solve()">=</button>
    </div>
</div>
<div id="solver">
    <h3>ax² + bx + c = 0</h3>
    <input type="number" id="valA" placeholder="A"><input type="number" id="valB" placeholder="B"><input type="number" id="valC" placeholder="C">
    <button class="s" style="width:120px; height:40px; margin-top:10px" onclick="calcBhaskara()">Resolver</button>
    <button class="o" style="width:120px; height:40px; margin-top:5px" onclick="closeSolver()">Fechar</button>
</div>
<script>
    let cur = '0', h = '';
    function upd() { document.getElementById('res').innerText = cur; document.getElementById('hist').innerText = h; }
    function add(v) { if(cur==='0' && v!=='.') cur=v; else cur+=v; upd(); }
    function clr() { cur='0'; h=''; upd(); }
    function back() { cur=cur.slice(0,-1)||'0'; upd(); }
    function perc() { cur=(parseFloat(cur)/100).toString(); upd(); }
    function sign() { cur=(parseFloat(cur)*-1).toString(); upd(); }
    function calcLog() { cur=Math.log10(parseFloat(cur)).toFixed(4); upd(); }
    function solve() { try { cur=eval(cur.replace(/×/g,'*').replace(/÷/g,'/')).toString(); upd(); } catch { cur='Erro'; upd(); } }
    function openSolver() { document.getElementById('solver').style.display='flex'; }
    function closeSolver() { document.getElementById('solver').style.display='none'; }
    function calcBhaskara() {
        const a=parseFloat(document.getElementById('valA').value), b=parseFloat(document.getElementById('valB').value), c=parseFloat(document.getElementById('valC').value);
        const d=(b*b)-(4*a*c);
        if(d<0) cur="Sem raiz real";
        else { const x1=(-b+Math.sqrt(d))/(2*a), x2=(-b-Math.sqrt(d))/(2*a); cur=`x1:${x1.toFixed(2)} x2:${x2.toFixed(2)}`; }
        closeSolver(); upd();
    }
</script>
</body>
  </html>
